name: semgrep

# Vulnerability management (SEC-07): SAST coverage today is CodeQL (codeql.yml) plus
# ruff's `S` (bandit) rule subset in the lint gate. Neither is a semantic,
# pattern-based SAST engine — CodeQL's `security-and-quality` query pack is strong on
# data-flow but Python-taint-rule coverage differs from Semgrep's, and ruff-S is a
# linter, not a SAST scanner. Semgrep's `p/ci` registry ruleset (OWASP + language
# best-practice rules, curated for low false-positive CI use, no Semgrep-app token
# required) closes that gap as a second, independently-sourced SAST pass. Runs on
# every PR into main and on a weekly schedule, same rationale as codeql.yml: a
# newly-published rule catches a pre-existing pattern even with no code change.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "42 4 * * 1" # Mondays, 04:42 UTC — offset from codeql.yml's 04:27 run

permissions:
  contents: read

# Cancel a superseded scan when a PR branch is updated; only the latest revision's
# result matters to the merge gate.
concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Semgrep SAST (p/ci)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      # Harden-Runner (SEC-04): deny-by-default egress. The allowlist below is
      # derived from the endpoints this job was OBSERVED calling in completed
      # audit-mode runs, not from a guess. Needs:
      # pip installs the pinned semgrep, which then fetches the `p/ci` ruleset from
      # semgrep.dev and posts anonymous run metrics.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            pypi.org:443
            files.pythonhosted.org:443
            semgrep.dev:443
            metrics.semgrep.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # Installed from PyPI like pip-audit in ci.yml, rather than a third-party
      # Action, so the only trust boundary is the pinned package version.
      - name: Install Semgrep
        run: python -m pip install --upgrade pip && pip install semgrep==1.145.0
      - name: SAST scan (Semgrep, SARIF for the Security tab)
        run: semgrep scan --config p/ci --sarif --output semgrep.sarif --error src tests
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          sarif_file: semgrep.sarif
