# Standards check — fetches the PINNED portfolio-standards at build time and
# runs the freshness gate. Nothing from portfolio-standards is committed into
# this repo; the standards exist only on the runner (.standards/, gitignored).
#
# Requires the repo secret STANDARDS_DEPLOY_KEY (the read-only deploy key's
# private half). Installed by automation/ci-fetch/install.sh.
name: standards

# pull_request is intentionally omitted: fork PRs do not receive repo secrets, so the
# private-standards fetch (deploy key) would fail for external contributors once this
# repo is public. The freshness gate is a maintainer concern, enforced on every push to main.
on:
  push:
    branches: [main]
  # Manual runs only ever re-run a read-only freshness check (`contents: read`, no
  # write scope anywhere in the job). It is here because a push-to-main-only workflow
  # is otherwise impossible to exercise from a branch — which meant the SEC-04 egress
  # allowlist below could not be verified before it reached main. A gate you cannot
  # rehearse is a gate you find out about by breaking main.
  workflow_dispatch:

# Least privilege: this job only reads. No write scope is granted to GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  # Key each push on its own commit. This workflow has no `pull_request` trigger
  # (see above), so every run is a push to `main` or a manual dispatch, and a
  # group keyed only on `github.ref` put all of them in one group: a third run
  # joining cancels the pending one with zero jobs dispatched, and
  # `cancel-in-progress: true` cancels the running one part-way through.
  #
  # Measured 2026-09-05 over the 100 most recent runs on `main`: 8 ended
  # `cancelled`, and those 8 commits have no successful freshness verdict. A gate
  # that runs only on push to `main` has no second chance to run.
  group: standards-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      # Harden-Runner (SEC-04): deny-by-default egress. The allowlist below is
      # derived from the endpoints this job was OBSERVED calling in completed
      # audit-mode runs, not from a guess. Needs:
      # the deploy-key checkout of the pinned private standards repo is an SSH clone, so
      # github.com is needed on 22 as well as 443.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            github.com:22
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch pinned standards (private, read-only deploy key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChelseaKR/portfolio-standards
          ref: v1.0.1                      # bump in lockstep with .standards-version
          ssh-key: ${{ secrets.STANDARDS_DEPLOY_KEY }}
          path: .standards
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Standards freshness gate
        run: python3 .standards/automation/check_staleness.py --standards-dir .standards
