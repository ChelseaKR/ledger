name: scheduled-secret-scan

# SEC-19: gitleaks in ci.yml scans the full checkout on every push and PR, but it
# only ever runs against the commits in that trigger's context. This job
# independently re-scans the entire git history (every commit, every branch tip)
# with a different engine (TruffleHog) on a schedule, so a secret that slipped
# past gitleaks -- or was committed before either scanner existed -- is still
# caught even with no new code change (security-aware maintenance, same rationale
# as the codeql.yml weekly run).
on:
  schedule:
    - cron: "13 5 * * 3" # Wednesdays, 05:13 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-secret-scan
  cancel-in-progress: true

jobs:
  trufflehog:
    name: full-history secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      # Harden-Runner (SEC-04): deny-by-default egress. The allowlist below is
      # derived from the endpoints this job was OBSERVED calling in completed
      # audit-mode runs, not from a guess. Needs:
      # a full-depth checkout and the pinned TruffleHog release tarball + checksum file,
      # both github.com release downloads.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Full-history secret scan (trufflehog)
        # Run the pinned trufflehog binary directly rather than the third-party
        # trufflehog-actions-scan / trufflesecurity/trufflehog GitHub Action, for
        # the same reason ci.yml runs the gitleaks binary directly: a pinned,
        # deterministic binary invocation instead of an unpinned Action tag.
        # `git file://.` with no --since-commit/--branch walks every commit
        # reachable from every ref in the checkout, i.e. the full history, not
        # just the current tip.
        #
        # --results=verified,unknown,unverified. This job previously excluded the
        # "unverified" tier, on the reasoning that it is low-confidence and that
        # dropping it saved maintaining a placeholder allowlist parallel to
        # .gitleaks.toml. That reasoning had the tiers backwards, and the effect
        # was a scheduled scan that could not fail on the case it exists for.
        #
        # TruffleHog sorts a finding three ways: `verified` (it authenticated
        # against the live service), `unverified` (it asked, and the service said
        # no) and `unknown` (it could not ask). A credential that was committed
        # and then revoked -- the normal end state of a real leak, and the exact
        # thing a history scan is for -- is `unverified`, because the revocation
        # is what makes the check fail. The repository's own gap ledgers already
        # record that `--only-verified` cannot fail on a revoked credential;
        # `--results=verified,unknown` excludes the same tier under a different
        # name.
        #
        # Measured 2026-09-06 on a throwaway clone with an AWS key planted in one
        # commit and deleted in the next:
        #
        #   --results=verified,unknown             exit 0,   0 secrets reported
        #   --results=verified,unknown,unverified  exit 183, unverified_secrets: 1
        #
        # The placeholder-allowlist cost was checked rather than assumed: this
        # repository's full history scans clean under all three tiers (6,239
        # chunks, 0 findings), so nothing needs allowlisting today. If a
        # placeholder ever does fire, exclude that detector by name rather than
        # widening the hole back to a whole tier.
        run: |
          TH=3.95.8
          BASE="https://github.com/trufflesecurity/trufflehog/releases/download/v${TH}"
          ARCHIVE="trufflehog_${TH}_linux_amd64.tar.gz"
          curl -sSfL -o "/tmp/${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -sSfL -o /tmp/trufflehog_checksums.txt \
            "${BASE}/trufflehog_${TH}_checksums.txt"
          (cd /tmp && grep "  ${ARCHIVE}$" trufflehog_checksums.txt | sha256sum --check --strict)
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp trufflehog
          /tmp/trufflehog git file://. \
            --results=verified,unknown,unverified \
            --fail \
            --no-update
